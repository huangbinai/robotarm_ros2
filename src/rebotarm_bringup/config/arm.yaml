# reBotArm 机械臂配置文件

# 通信方式: CAN (can0 / can1) 或 串口桥 (/dev/ttyACM0)
channel: /dev/ttyACM0

# 控制循环频率 (Hz)。这是底层 SDK 频率，不等同于 ROS joint_state 发布频率。
rate: 100

joints:
  # J1-J3 使用 4340P；参数需要结合真实负载和控制模式标定。
  # joint1:
  - name: joint1
    motor_id: 0x01
    feedback_id: 0x11
    model: "4340P"
    vendor: "damiao"          # damiao | myactuator | robstride
    MIT:
      kp: 120.0
      kd: 8.0
    POS_VEL:
      vel_kp: 0.0125
      vel_ki: 0.004
      pos_kp: 150.0
      pos_ki: 0.5
      vlim: 5.0

  # joint2:
