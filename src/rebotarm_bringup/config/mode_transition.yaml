reBotArmController:
  ros__parameters:
    mode_transition.enabled: true
    mode_transition.allow_velocity_mode: false
    mode_transition.enter.ramp_duration_sec: 0.35
    mode_transition.enter.max_start_velocity_rad_s: 0.05
    mode_transition.exit.damping_duration_sec: 0.15
    mode_transition.exit.blend_duration_sec: 0.35
    mode_transition.exit.max_lock_velocity_rad_s: 0.05
    mode_transition.exit.velocity_wait_timeout_sec: 1.0
    mode_transition.mit.gravity_kp: 7.0
    mode_transition.mit.gravity_kd: 0.8
    mode_transition.mit.hold_kp: 12.0
    mode_transition.mit.hold_kd: 1.2
    mode_transition.pos_vel.settle_duration_sec: 0.15
    mode_transition.safety.max_position_jump_rad: 0.02
    mode_transition.safety.feedback_timeout_sec: 0.10
    mode_transition.safety.transition_timeout_sec: 2.0
