# Ubuntu local RGB-D. Aligned/rectified color uses the depth optical frame.
rebotarm_vision_node:
  ros__parameters:
    camera.type: gemini2
    camera.color_width: 640
    camera.color_height: 480
    camera.color_fps: 30
    camera.enable_depth: true
    camera.depth_width: 0
    camera.depth_height: 0
    camera.depth_fps: 30
    camera.enable_align: true
    camera.warmup_frames: 15
    camera.frame_timeout_ms: 1000
    camera.max_frame_skew_ms: 50.0
    ros.frame_id_depth: camera_depth_frame
    ros.loop_rate_hz: 15.0

rebotarm_yolo_node:
  ros__parameters:
    input_color_topic: /camera/color/image_raw
    output_detections_topic: /grasp/detections
    # Explicit local file overrides automatic workspace/package lookup.
    yolo.model_path: ""
    yolo.device: cuda:0
    yolo.conf_threshold: 0.25
    yolo.iou_threshold: 0.45
    inference_rate_hz: 5.0
    max_frame_age_sec: 1.5
    publish_annotated: true

rebotarm_grasp_tcp_frame:
  ros__parameters:
    parent_frame: end_link
    child_frame: grasp_tcp
    tcp_offset_xyz: [-0.04, 0.0, 0.0]

rebotarm_grasp_preview_sender:
  ros__parameters:
    input_topic: /grasp/filtered_plan
    output_topic: /rebotarm/interactive_control/pose_target
    pose_mode: pregrasp
    target_frame: base_link
    tcp_offset_xyz: [-0.04, 0.0, 0.0]
    publish_count: 20
    exit_after_publish: true
