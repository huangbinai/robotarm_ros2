rebotarm_vision_node:
  ros__parameters:
    camera.type: network_mjpeg
    camera.color_width: 1280
    camera.color_height: 720
    camera.color_fps: 30
    camera.color_format: MJPG
    camera.enable_depth: false
    camera.depth_width: 1280
    camera.depth_height: 800
    camera.depth_fps: 30
    camera.enable_align: false
    camera.warmup_frames: 15
    camera.frame_timeout_ms: 1000
    camera.max_empty_frames: 30
    camera.network_snapshot_url: http://192.168.145.1:8081/snapshot.jpg
    camera.network_stream_url: http://192.168.145.1:8081/video.mjpg
    camera.network_depth_url: http://192.168.145.1:8081/depth.png
    camera.network_camera_info_url: http://192.168.145.1:8081/camera_info.json
    camera.network_detections_url: http://192.168.145.1:8081/detections.json
    camera.network_detections_timeout_ms: 1000
    yolo.model_path: /home/u24/rebot_ai_models/yoloe-26s-seg.pt
    yolo.device: cpu
    yolo.conf_threshold: 0.25
    yolo.iou_threshold: 0.45
    yolo.use_world: true
    yolo.custom_classes:
      - yellow banana
      - water bottle
      - light blue coffee cup
      - cup
      - green object
      - red object
      - tool
    ros.frame_id_color: camera_color_frame
    ros.frame_id_depth: camera_depth_frame
    ros.publish_annotated: false
    ros.show_preview: false
    ros.preview_window_name: RebotArm Vision Preview
    ros.loop_rate_hz: 15.0
    ros.enable_detection: false
    ros.enable_network_detection: true

rebotarm_grasp_tcp_frame:
  ros__parameters:
    parent_frame: end_link
    child_frame: grasp_tcp
    # end_link -> grasp_tcp translation in end_link frame. Keep [0,0,0] until
    # the real gripper center is measured in RViz/TF, then update this value.
    tcp_offset_xyz: [-0.04, 0.0, 0.0]

rebotarm_grasp_preview_sender:
  ros__parameters:
    input_topic: /grasp/filtered_plan
    output_topic: /rebotarm/interactive_control/pose_target
    pose_mode: pregrasp
    target_frame: base_link
    tcp_offset_xyz: [-0.04, 0.0, 0.0]
    publish_count: 20
    exit_after_publish: true
